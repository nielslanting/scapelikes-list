name: Validate list

on:
  pull_request:
  push:
    branches:
      - main

jobs:
  validate:
    name: Validate list
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Validate list
        run: npm run validate:list
